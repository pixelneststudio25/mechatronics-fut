<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Icons -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0A0714">
  <meta name="color-scheme" content="dark light">

  <!-- SEO -->
  <title>Gallery | Mechatronics Engineering, FUT Minna</title>
  <meta name="description" content="Photos from the Department of Mechatronics Engineering, FUT Minna: events, student projects and department life.">
  <link rel="canonical" href="https://mechatronics-fut.vercel.app/gallery.html">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mechatronics Engineering, FUT Minna">
  <meta property="og:locale" content="en_NG">
  <meta property="og:title" content="Gallery | Mechatronics Engineering, FUT Minna">
  <meta property="og:description" content="Photos from events and student projects in the Department of Mechatronics Engineering.">
  <meta property="og:url" content="https://mechatronics-fut.vercel.app/gallery.html">
  <meta property="og:image" content="https://mechatronics-fut.vercel.app/images/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Mechatronics Engineering, Federal University of Technology, Minna, with the department's gear and M mark on a deep purple background">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gallery | Mechatronics Engineering, FUT Minna">
  <meta name="twitter:description" content="Photos from events and student projects in the Department of Mechatronics Engineering.">
  <meta name="twitter:image" content="https://mechatronics-fut.vercel.app/images/og-image.png">
  <meta name="twitter:image:alt" content="Mechatronics Engineering, Federal University of Technology, Minna">

  <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/gallery.css">

  <script src="/js/site-config.js"></script>
  <script src="/data/gallery.js"></script>
  <script src="/js/components.js" defer></script>
  <script src="/js/gallery.js" defer></script>
</head>
<body>

  <div id="site-header"></div>

  <main id="main">

    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">Moments</p>
        <h1>Gallery</h1>
        <p class="lead">Photos from department events and student projects.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="chips" id="g-filters" role="group" aria-label="Filter photos"></div>
        <p class="g-count" id="g-count" aria-live="polite"></p>
        <ul class="g-grid" id="g-grid"></ul>
        <noscript><p>The gallery needs JavaScript. Please enable it to see the photos.</p></noscript>

        <div class="g-note">
          <p>Have photos from a department event or project? <a href="/contact.html">Send them to us</a> and we will add them.</p>
        </div>
      </div>
    </section>

  </main>

  <!-- Photo viewer -->
  <dialog class="lb" id="lb" aria-label="Photo viewer">
    <div class="lb__bar">
      <span class="lb__count" id="lb-count" aria-live="polite"></span>
      <button class="lb__btn" type="button" id="lb-close" aria-label="Close viewer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="lb__stage" id="lb-stage">
      <button class="lb__btn lb__nav lb__nav--prev" type="button" id="lb-prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
      <figure class="lb__fig">
        <img id="lb-img" alt="">
        <figcaption id="lb-cap"></figcaption>
      </figure>
      <button class="lb__btn lb__nav lb__nav--next" type="button" id="lb-next" aria-label="Next photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
  </dialog>

  <div id="site-footer"></div>

</body>
</html>

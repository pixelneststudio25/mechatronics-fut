<body>

  <div id="site-header"></div>

  <main id="main">

    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">For students</p>
        <h1>Resources</h1>
        <p class="lead">Lecture notes, past questions, textbooks and timetables, organised by level and course.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <div class="rfilters">
          <div class="fgroup">
            <p class="fgroup__label" id="lbl-level">Level</p>
            <div class="chips" id="f-level" role="group" aria-labelledby="lbl-level">
              <button type="button" data-v="all" aria-pressed="true">All</button>
              <button type="button" data-v="100" aria-pressed="false">100</button>
              <button type="button" data-v="200" aria-pressed="false">200</button>
              <button type="button" data-v="300" aria-pressed="false">300</button>
              <button type="button" data-v="400" aria-pressed="false">400</button>
              <button type="button" data-v="500" aria-pressed="false">500</button>
              <button type="button" data-v="general" aria-pressed="false">General</button>
            </div>
          </div>
          <div class="fgroup">
            <p class="fgroup__label" id="lbl-kind">Type</p>
            <div class="chips" id="f-kind" role="group" aria-labelledby="lbl-kind">
              <button type="button" data-v="all" aria-pressed="true">All</button>
              <button type="button" data-v="notes" aria-pressed="false">Notes</button>
              <button type="button" data-v="past-questions" aria-pressed="false">Past questions</button>
              <button type="button" data-v="textbook" aria-pressed="false">Textbooks</button>
              <button type="button" data-v="timetable" aria-pressed="false">Timetables</button>
              <button type="button" data-v="other" aria-pressed="false">Other</button>
            </div>
          </div>
          <div class="fgroup fgroup--search">
            <label class="fgroup__label" for="r-search">Search</label>
            <input id="r-search" type="search" placeholder="Course code or title, for example MEE 311" autocomplete="off">
          </div>
        </div>
        <p class="rcount" id="r-count" aria-live="polite"></p>

        <div id="r-list" aria-live="polite">
          <div class="rgrid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
        <noscript><p>The resources list needs JavaScript. Please enable it to see it.</p></noscript>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

</body>

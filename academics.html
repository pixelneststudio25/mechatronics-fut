<body>

    <section class="page-hero">

        <p class="eyebrow">For students</p>
        <h1>Academics</h1>
        <p class="lead">The five-year Mechatronics Engineering programme, level by level, with materials and past questions for each.</p>

    <section class="section" style="padding-bottom: 0">
      <div class="container">
        <div class="notice" id="status" role="status"></div>
      </div>
    </section>

    <section class="section" aria-labelledby="overview-title" style="padding-bottom: 0">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Programme overview</p>
            <h2 id="overview-title">Five years, five levels</h2>
          </div>
        </div>
        <ol class="timeline">
          <li><span class="timeline__level">100</span><span class="timeline__year">Year 1</span></li>
          <li><span class="timeline__level">200</span><span class="timeline__year">Year 2</span></li>

      </div>
    </section>

    <section class="section" aria-labelledby="courses-title">
      <div class="container">
        <div class="section-head">
          <div>
            <p class="eyebrow">Courses</p>
            <h2 id="courses-title">Find your courses</h2>
          </div>
        </div>

        <div role="search" style="margin-bottom: var(--space-6)">
          <label class="visually-hidden" for="course-search">Search all courses by code or title</label>
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            <input id="course-search" type="search" placeholder="Search all courses, for example MEE 311 or control" autocomplete="off">
          </div>
          <p class="search-count" id="search-count" aria-live="polite"></p>
        </div>

        <div id="levels"></div>
        <noscript><div class="notice">The course tables need JavaScript. Please enable it, or contact the department for the course list.</div></noscript>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>
